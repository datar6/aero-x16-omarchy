### Compact one-line overlay for the AERO X16 (RTX 5070 Laptop, 165 Hz panel)

## Layout: single horizontal line in the top-left corner
horizontal
hud_compact
position=top-left
background_alpha=0.4
font_size=20
table_columns=14

## What to show
fps
frametime=0
frame_timing=0
gpu_name
gpu_stats
gpu_temp
gpu_power
vram
cpu_stats
cpu_temp
ram

## FPS limit: 165 = panel refresh rate, 0 = unlimited.
## Right Ctrl + Right Shift + L switches between them.
fps_limit=165,0
fps_limit_method=late

## Hotkeys (no F-keys: on this laptop F12 sends Print = screenshot)
toggle_hud=Control_R+Shift_R+h
toggle_fps_limit=Control_R+Shift_R+l
toggle_logging=Control_R+Shift_R+r

## Benchmark logs (Right Ctrl + Right Shift + R) go here
output_folder=/home/datar6/Documents/mangohud-logs
